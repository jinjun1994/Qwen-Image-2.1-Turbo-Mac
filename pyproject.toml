[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqwen-infer"
version = "0.3.0"
description = "Native MLX/Metal Qwen Image 2.1 Turbo CLI and local WebUI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
native = ["mlx==0.32.4", "mflux==0.23.0", "numpy==2.5.4", "Pillow==12.3.0", "transformers==5.20.2"]

[project.scripts]
mqwen = "mqwen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mqwen = ["assets/tokenizer/*", "assets/*.json", "assets/web/*", "assets/licenses/*", "assets/kernels/*.metal"]
